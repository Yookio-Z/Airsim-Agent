# Provider registry sketch for future adapters.
#
# The gateway_node currently implements the PX4 control provider and an
# optional LaserScan obstacle provider. Third-party packages can be added by
# launching their ROS nodes and registering an adapter that maps their topics,
# services, or actions into these provider surfaces.

px4:
  status_topics:
    vehicle_status: /fmu/out/vehicle_status
    vehicle_local_position: /fmu/out/vehicle_local_position
    vehicle_attitude: /fmu/out/vehicle_attitude
  command_topics:
    vehicle_command: /fmu/in/vehicle_command
    offboard_control_mode: /fmu/in/offboard_control_mode
    trajectory_setpoint: /fmu/in/trajectory_setpoint

obstacle:
  adapter: laserscan
  topic: ""
  front_angle_deg: 60.0
  safety_margin_m: 1.0
