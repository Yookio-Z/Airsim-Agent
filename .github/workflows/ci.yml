name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test (full suite)
        run: python -m pytest tests/ -q
      - name: Coverage gate (critical reliability surface, see .coveragerc)
        run: python -m pytest tests/ --cov --cov-report=term-missing --cov-fail-under=45
