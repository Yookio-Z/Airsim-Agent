[project]
name = "airsim-controller"
version = "0.1.0"
description = "UAV agent and ground-station control runtime for AirSim, PX4, and future ROS-backed vehicles"
requires-python = ">=3.10"
authors = [
    { name = "AirSim Controller Team" }
]
keywords = ["airsim", "drone", "uav", "simulation", "robotics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "airsim>=1.8.0",
    "backports.ssl_match_hostname>=3.7.0.1",
    # AirSim transfers float images as MessagePack lists of floats. The legacy
    # msgpack-python 0.5.x used by msgpack-rpc-python has no C extension here,
    # so a 256x144 depth frame costs ~85 ms in pure-Python pack/unpack. Pinning
    # the C-accelerated distribution and the vendored metadata fix (see
    # vendor/msgpack_rpc_python/README.md) removes that cost.
    "msgpack==1.1.2",
    "msgpack-rpc-python==0.4.1",
    "numpy>=1.20.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
    "pydantic-settings>=2.0",
    "pymavlink>=2.4.0",
    "pyserial>=3.5",
    "ultralytics>=8.0.0",
    # Perception inference runs on the RTX 4050. Declaring the CUDA build
    # explicitly keeps `uv sync` from silently replacing it with the CPU wheel
    # from PyPI (which made detect inference ~14x slower: 513 ms vs 37 ms).
    "torch==2.12.1",
    "torchvision==0.27.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=5.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
]

[project.scripts]
airsim-agent-ui = "src.ui.server:main"

[project.urls]
Homepage = "https://github.com/yourusername/airsim-controller"
Repository = "https://github.com/yourusername/airsim-controller"
Documentation = "https://github.com/yourusername/airsim-controller/blob/main/README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[[tool.uv.index]]
# CUDA 13.0 wheels for the laptop GPU. `explicit` means only packages routed to
# it below use this index; everything else still comes from PyPI.
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
# Same code as upstream msgpack-rpc-python 0.4.1; only the declared dependency
# changes from msgpack-python to msgpack>=1.1.2 so the two distributions cannot
# shadow each other's `msgpack/` package directory.
msgpack-rpc-python = { path = "vendor/msgpack_rpc_python" }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.uv.extra-build-dependencies]
airsim = [
    "numpy",
    "msgpack-rpc-python",
    "backports.ssl_match_hostname"
]
